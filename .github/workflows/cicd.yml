name: Terraform AWS CI-CD Demo

on:
  push:
    branches:
      - main

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run tests
        working-directory: app
        run: pytest

  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: ci
    outputs:
      public_ip: ${{ steps.tf_outputs.outputs.public_ip }}
      app_url: ${{ steps.tf_outputs.outputs.app_url }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: infra
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_public_key: ${{ secrets.TF_VAR_public_key }}
        run: terraform init

      - name: Terraform plan
        working-directory: infra
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_public_key: ${{ secrets.TF_VAR_public_key }}
        run: terraform plan

      - name: Terraform apply
        working-directory: infra
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_public_key: ${{ secrets.TF_VAR_public_key }}
        run: terraform apply -auto-approve

      - name: Capture Terraform outputs
        id: tf_outputs
        working-directory: infra
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_public_key: ${{ secrets.TF_VAR_public_key }}
        run: |
          echo "public_ip=$(terraform output -raw public_ip)" >> $GITHUB_OUTPUT
          echo "app_url=$(terraform output -raw app_url)" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy App to EC2
    runs-on: ubuntu-latest
    needs: terraform

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Create SSH private key file
        run: |
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > demo-key.pem
          chmod 600 demo-key.pem

      - name: Wait for EC2 to become reachable
        run: |
          for i in {1..20}; do
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i demo-key.pem ec2-user@${{ needs.terraform.outputs.public_ip }} "echo connected"; then
              echo "EC2 is reachable"
              exit 0
            fi
            echo "Waiting for SSH..."
            sleep 15
          done
          echo "EC2 did not become reachable in time"
          exit 1

      - name: Deploy application
        run: bash scripts/deploy_app.sh "${{ needs.terraform.outputs.public_ip }}" demo-key.pem

      - name: Show deployed application URL
        run: 'echo "Application URL: ${{ needs.terraform.outputs.app_url }}"'
